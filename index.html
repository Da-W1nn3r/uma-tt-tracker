<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uma Team Trials Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Team Trials Tracker</h1>
  <div id="phase" class="phase"></div>
  <div id="save-status" class="save-status"></div>
  <div class="actions">
    <button id="about-btn" title="How the rating works">ⓘ About</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <button id="reset-all" class="danger">Clear all</button>
    <input type="file" id="import-file" accept=".json" hidden>
  </div>
</header>

<main>
  <section id="roster"></section>

  <section id="round" hidden>
    <h2 id="round-title"></h2>
    <p class="hint" id="round-hint"></p>
    <button id="back">Back</button>
    <button id="next" class="primary"></button>
    <button id="clear-picks">Clear picks</button>
  </section>

  <section id="board-wrap">
    <h2>Leaderboard</h2>
    <ol id="board"></ol>
  </section>

  <section>
    <h2>Rating over time
      <select id="range" title="How much history the chart shows">
        <option value="25">25 rounds</option>
        <option value="50">50 rounds</option>
        <option value="100">100 rounds</option>
        <option value="oldest" selected>Oldest member</option>
        <!-- <option value="all">All time</option> -->
      </select>
    </h2>
    <div id="chart-wrap"><svg id="chart"></svg><div id="tip" hidden></div></div>
    <div id="legend"></div>
  </section>
</main>

<dialog id="picker">
  <form method="dialog">
    <h3 id="picker-title"></h3>
    <input id="search" type="search" placeholder="Search uma…" autocomplete="off">
    <div id="grid"></div>
    <div class="dlg-actions"><button value="cancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="about">
  <form method="dialog">
    <div id="about-body">Loading…</div>
    <div class="dlg-actions"><button value="close">Close</button></div>
  </form>
</dialog>

<script src="umas.js?v=1790780938"></script>
<script src="rating.js?v=1790780938"></script>
<script src="app.js?v=1790780938"></script>
</body>
</html>
